<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bili轻装">
  <meta name="application-name" content="Bili轻装">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="在你的浏览器本地运行的 B 站轻装界面。">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="https://bili-web.jiojiojackson.workers.dev/apple-touch-icon.png?v=2.4.0">
  <link rel="stylesheet" href="/style.css">
  <title>Bili轻装</title>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="search-row">
        <button class="avatar-button" id="avatar" aria-label="登录与我的账号"><span class="guest-avatar" aria-hidden="true">哔</span></button>
        <form id="search-form" role="search"><span id="search-icon"></span><input id="search" type="search" placeholder="搜索视频、番剧或 UP 主" aria-label="搜索视频" enterkeyhint="search" autocomplete="off"><button id="search-clear" type="button" aria-label="清除搜索" hidden>×</button></form>
      </div>
      <div class="tabs" role="tablist" aria-label="视频分类"><button class="tab active" role="tab" aria-selected="true" data-tab="recommend">推荐</button><button class="tab" role="tab" aria-selected="false" data-tab="anime">番剧</button><button class="refresh-button" id="refresh" aria-label="刷新推荐"></button></div>
    </header>
    <main id="main">
      <div class="pull-indicator" id="pull" aria-live="polite"><span class="pull-icon">↓</span><span id="pull-label">下拉换一批</span></div>
      <div class="feed-heading" id="feed-heading" hidden></div>
      <div id="notice" class="notice" hidden></div>
      <section class="feed" id="feed" aria-label="推荐视频" aria-busy="true"></section>
      <div class="feed-end" id="feed-end"><button id="load-more">加载更多</button><span id="load-label"></span></div>
    </main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-nav="home"><span class="nav-icon" data-icon="home"></span><span>首页</span></button>
      <button class="nav-item" data-nav="following"><span class="nav-icon" data-icon="follow"></span><span>关注</span></button>
      <button class="nav-item" data-nav="messages"><span class="nav-icon" data-icon="message"></span><span>消息</span></button>
      <button class="nav-item" data-nav="profile"><span class="nav-icon" data-icon="tv"></span><span>我的</span></button>
    </nav>
  </div>
  <dialog id="sheet" class="sheet"><div class="sheet-handle"></div><button class="sheet-close" aria-label="关闭">×</button><div id="sheet-content"></div></dialog>
  <dialog id="player" class="player-dialog"><div class="player-shell"><div class="player-top"><button id="player-close" aria-label="关闭播放器"></button><span>正在播放</span><a id="official-video" target="_blank" rel="noopener noreferrer">B 站打开 ↗</a></div><div class="video-wrap"><video id="video" controls playsinline preload="metadata"></video><div id="play-status" role="status"></div></div><div class="video-toolbar"><label for="video-quality">清晰度</label><select id="video-quality" aria-label="视频清晰度" disabled><option value="">获取中…</option></select><span id="quality-note" role="status">由 B 站实际返回的画质决定</span></div><div class="player-info" id="player-info"></div><div id="parts" class="parts"></div><div class="player-actions"><button id="save-video"></button><button id="share-video"></button></div><section class="comments-panel" id="comments-panel" aria-label="视频评论" hidden><div class="comments-header"><h2>评论 <span id="comments-count"></span></h2><div class="comments-sort" aria-label="评论排序"><button type="button" data-comment-mode="hot" class="selected" aria-pressed="true">热门</button><button type="button" data-comment-mode="recent" aria-pressed="false">最新</button></div></div><div id="comments-status" class="comments-status" role="status"></div><div id="comments-list" class="comments-list"></div><button type="button" class="comments-more" id="comments-more" hidden>加载更多评论</button><p class="comments-readonly">仅查看 B 站官方评论，暂不支持发表或点赞。</p></section><div class="related-title">接着看</div><div class="feed related" id="related"></div></div></dialog>
  <dialog id="creator-dialog" class="creator-dialog" aria-labelledby="creator-heading">
    <header class="creator-top"><button type="button" id="creator-close" aria-label="返回视频">‹</button><h2 id="creator-heading">UP 主空间</h2><a id="creator-official" href="#" target="_blank" rel="noopener noreferrer">官方空间 ↗</a></header>
    <div class="creator-body"><div id="creator-profile"></div><p id="creator-profile-note" class="creator-profile-note"></p><div class="creator-list-head"><h3>TA 的投稿</h3><span>最新发布</span></div><div id="creator-videos" class="creator-videos"></div><p id="creator-video-status" class="creator-video-status" role="status"></p><button type="button" id="creator-more" class="creator-more">加载更多投稿</button></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>

</body>
</html>
